<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css"> 
  <title>Davis | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <main>

    <div class="success-message">
      <div class="wrap"> 
        <img src="./assets/images/icon-success-check.svg" alt="">
      <a href="">Message Sent!</a>
    </div>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>

    <div class="contact-form">
      
      <h1>Contact Us</h1>

      <form novalidate>

        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="First_Name" required>
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="Last_Name" required>
          <span class="error-message"></span>
        </div>

        <div class="form-group span-all" >
          <label for="email">Email Address</label>
          <input type="email" data-error="Please enter a valid email address" id="email" name="Email_Address" required>
          <span class="error-message"></span>
        </div>

        <fieldset class="span-all">
          <legend>Query Type</legend>

          <div class="form-group">
            <input type="radio" data-error="Please select a query type" required id="general" value="General_Enquiry" name="general">
            <label for="general">General Enquiry</label>
          </div>

          <div class="form-group">
            <input type="radio" data-error="Please select a query type" required id="support" value="Support_Request" name="general">
            <label for="support">Support Request</label>
          </div>
          <span class="error-message"></span>
        </fieldset>

        <div class="form-group span-all">
          <label for="message">Message</label>
          <textarea name="message" id="message" name="Message" required></textarea>
          <span class="error-message"></span>
        </div>

        <div class="form-group span-all">  
          <input type="checkbox" data-error="To submit this form, you must consent to being contacted" id="consent" name="consent" value="consent" required>
            <label for="consent">I consent to being contacted by the team</label>
            <span class="error-message span-all"></span>
        </div>

        <button type="submit" class="span-all">Submit</button>
      </form>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
